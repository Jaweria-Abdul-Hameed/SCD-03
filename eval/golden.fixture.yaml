# eval/golden.fixture.yaml — golden set for the CI fixture corpus ONLY.
#
# WHY THIS FILE EXISTS: eval/golden.yaml describes the real FAST-NUCES corpus
# (Academic Rules Handbook, Prospectus, Fee page ...). CI's e2e-eval job only
# indexes the three tiny invented documents in eval/fixtures/ and runs the API
# with the deterministic STUB provider (no LLM, hash embeddings). Running the
# real golden set against that stack can never match a citation or measure
# recall, so the gate would fail for reasons unrelated to code quality.
#
# This file keeps the same shape, the same type counts (8/2/2/2/1) and the
# same gate (eval/run_eval.py, sec. 5.4), but every question targets a fixture
# document. All values are FIXTURE values invented for CI - never real rules.
# `chunk_ids` are sha256(source|section|chunk_index) of the single chunk each
# fixture document produces. Questions were chosen so the stub's lexical
# embedding retrieves the intended document above RELEVANCE_FLOOR (0.35);
# abstain questions deliberately score below it.
#
# The REAL golden set and baseline (eval/golden.yaml, eval/baseline.json) are
# unchanged and must still be run against the full corpus + real model.

questions:
  - id: G01
    type: ordinary
    question: "Can a student who has failed a prerequisite course register for the course that requires it"
    relevant: { document: "doc1.md", section: "N/A" }
    chunk_ids: ["9223e2c4fe7586c52ee23e60db05c1d6f4b8b1efaca852f5c37555176c56b037"]
    expected_answer: "No, unless the department grants written permission in exceptional circumstances (fixture doc1, clause 4.4)."
    verified: true
    notes: "Fixture corpus question (CI only)."

  - id: G02
    type: ordinary
    question: "What is the minimum attendance a student must attend in the lectures, tutorials and laboratory sessions of a course"
    relevant: { document: "doc1.md", section: "N/A" }
    chunk_ids: ["9223e2c4fe7586c52ee23e60db05c1d6f4b8b1efaca852f5c37555176c56b037"]
    expected_answer: "At least 80% (fixture value, doc1 clause 1.21)."
    verified: true
    notes: "Fixture corpus question (CI only)."

  - id: G03
    type: ordinary
    question: "For how long does the written permission apply and where is it recorded on the student's file"
    relevant: { document: "doc1.md", section: "N/A" }
    chunk_ids: ["9223e2c4fe7586c52ee23e60db05c1d6f4b8b1efaca852f5c37555176c56b037"]
    expected_answer: "Recorded on the student's file; applies to that semester only (fixture doc1)."
    verified: true
    notes: "Fixture corpus question (CI only)."

  - id: G04
    type: ordinary
    question: "Within the first week of classes what refund of the tuition fee is given"
    relevant: { document: "doc2.md", section: "N/A" }
    chunk_ids: ["97013160956fb2e7ef1152b009be837d6b8967f1305d66f8e530ffb3ec37072b"]
    expected_answer: "100% (fixture value, doc2 refund table)."
    verified: true
    notes: "Fixture corpus question (CI only)."

  - id: G05
    type: ordinary
    question: "What refund of the tuition fee is given after the second week of classes"
    relevant: { document: "doc2.md", section: "N/A" }
    chunk_ids: ["97013160956fb2e7ef1152b009be837d6b8967f1305d66f8e530ffb3ec37072b"]
    expected_answer: "0% (fixture value, doc2 refund table)."
    verified: true
    notes: "Fixture corpus question (CI only)."

  - id: G06
    type: ordinary
    question: "What refund of the tuition fee is given within the first week of classes and within the second week of classes"
    relevant: { document: "doc2.md", section: "N/A" }
    chunk_ids: ["97013160956fb2e7ef1152b009be837d6b8967f1305d66f8e530ffb3ec37072b"]
    expected_answer: "100% in the first week and 50% in the second week (fixture doc2)."
    verified: true
    notes: "Fixture corpus question (CI only)."

  - id: G07
    type: ordinary
    question: "What happens to a student whose attendance falls below 80% of the lectures of a course"
    relevant: { document: "doc1.md", section: "N/A" }
    chunk_ids: ["9223e2c4fe7586c52ee23e60db05c1d6f4b8b1efaca852f5c37555176c56b037"]
    expected_answer: "Not permitted to sit the final examination of that course (fixture doc1)."
