  - id: G13
    type: must-abstain
    question: "What are the hostel allotment rules for first-year students?"
    relevant: { document: "NONE - deliberately absent from corpus", section: "N/A" }
    chunk_ids: []
    expected_answer: "answered_from_context=false (the corpus has no hostel document)."
    verified: true
    notes: "Must abstain."

  - id: G14
    type: must-abstain
    question: "Which bus routes serve the university campus, and what are their timings?"
