<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAHBAR — Grounded Q&amp;A</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
  #abstain { display: none; background: #fff3cd; border: 1px solid #e0a800; padding: .75rem; margin: 1rem 0; }
  #answer { margin-top: 1rem; line-height: 1.5; }
  #answer p { margin: .4rem 0; }
  #answer ul, #answer ol { margin: .4rem 0 .4rem 1.2rem; padding-left: .8rem; }
  #citations { margin-top: 1rem; font-size: .9rem; }
  #citations li { margin-bottom: .25rem; }
  #error { color: #b00020; margin-top: 1rem; }
  input, button { font-size: 1rem; padding: .5rem; }
  input { width: 70%; }
</style>
</head>
<body>
<h1>RAHBAR</h1>
<p>Ask about FAST-NUCES academic rules. Answers come only from the indexed corpus, with citations — or the system says it does not know.</p>
<form id="chat-form">
  <input id="question" type="text" minlength="3" maxlength="500" required
         placeholder="e.g. Can I register for a course after failing its prerequisite?">
  <button type="submit">Ask</button>
</form>
<div id="abstain" role="alert"><strong>Not covered by the corpus.</strong> The documents do not contain an answer to this question, so RAHBAR is abstaining rather than guessing.</div>
<div id="answer"></div>
<ul id="citations"></ul>
<div id="error"></div>
<script>
  // Minimal, safe Markdown (bold, bullet / numbered lists, paragraphs): all text is HTML-escaped first.
  function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function inline(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
  function renderMarkdown(text) {
    const out = []; let list = null;
    const close = () => { if (list) { out.push('</' + list + '>'); list = null; } };
    text.split(/\r?\n/).forEach((raw) => {
      const line = raw.trim();
      const b = line.match(/^[-*\u2022]\s+(.*)$/), n = line.match(/^\d+[.)]\s+(.*)$/);
      if (b || n) {
        const kind = b ? 'ul' : 'ol';
        if (list !== kind) { close(); out.push('<' + kind + '>'); list = kind; }
        out.push('<li>' + inline((b || n)[1]) + '</li>');
      } else if (line) { close(); out.push('<p>' + inline(line) + '</p>'); }
      else { close(); }
    });
    close();
    return out.join('');
  }
  const form = document.getElementById('chat-form');
  const q = document.getElementById('question');
  const answerEl = document.getElementById('answer');
  const citationsEl = document.getElementById('citations');
  const abstainEl = document.getElementById('abstain');
  const errorEl = document.getElementById('error');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const question = q.value.trim();
    if (question.length < 3 || question.length > 500) return;
    answerEl.textContent = 'Thinking…';
    citationsEl.innerHTML = '';
    abstainEl.style.display = 'none';
    errorEl.textContent = '';
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question })
      });
      if (!res.ok) throw new Error('Request failed: ' + res.status);
      const data = await res.json();
      const ansObj = (typeof data.answer === 'object' && data.answer !== null) ? data.answer : {};
      const answerText = typeof data.answer === 'string' ? data.answer : (ansObj.answer || '');
      const answeredFromContext = typeof ansObj.answered_from_context === 'boolean'
        ? ansObj.answered_from_context
        : data.answered_from_context;
      const citations = Array.isArray(ansObj.citations)
        ? ansObj.citations
        : (Array.isArray(data.citations) ? data.citations : []);

      answerEl.innerHTML = renderMarkdown(answerText);
      if (answeredFromContext === false) abstainEl.style.display = 'block';
      citations.forEach((c) => {
        const li = document.createElement('li');
        li.textContent = c.source + ' — ' + c.section + ' (p. ' + c.page + ')';
        citationsEl.appendChild(li);
      });
    } catch (err) {
      answerEl.textContent = '';
      errorEl.textContent = 'Something went wrong: ' + err.message;
    }
  });
</script>
</body>
</html>
