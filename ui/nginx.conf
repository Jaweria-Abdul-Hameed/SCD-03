# Non-root nginx config: all writable state goes to /tmp or emptyDir mounts
# (the pod runs with readOnlyRootFilesystem: true). Listens on 8080 —
# a non-root process cannot bind port 80; the Service maps 80 -> 8080.
user 10001;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/nginx-access.log;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Static UI; /api/* is routed by the Ingress to the API Service,
        # so nginx here serves the page and also proxies /api/ (below). The browser calls /api/chat
        # relatively, which the Ingress rewrites to the API.
        # Same-origin chat calls work however the page is reached (Ingress OR a
        # direct port-forward to this Service): /api/* is proxied to the API Service.
        # Allowed by the allow-ui NetworkPolicy (ui -> api:8000). Long timeout: CPU LLM.
        location /api/ {
            proxy_pass http://api.rahbar.svc.cluster.local:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 400s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
