# Helper pod for operators: mounts the three RAGOps PVCs so you can
#   - copy Batch B / unseen documents into the data lake   (kubectl cp ... pvc-helper:/corpus/...)
#   - seed or read the eval baseline / result files         (/results)
#   - read the trace log written by the API                 (/traces/traces.jsonl)
# It has no network access (default-deny NetworkPolicy) and never touches Chroma:
# the indexer Job stays the only writer to the vector store.
apiVersion: v1
kind: Pod
metadata:
  name: pvc-helper
  namespace: rahbar
  labels:
    app: pvc-helper
    app.kubernetes.io/part-of: rahbar
spec:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: helper
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command: ["sleep", "86400"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: corpus
          mountPath: /corpus
        - name: traces
          mountPath: /traces
        - name: results
          mountPath: /results
  volumes:
    - name: corpus
      persistentVolumeClaim:
        claimName: corpus-data
    - name: traces
      persistentVolumeClaim:
        claimName: traces-data
    - name: results
      persistentVolumeClaim:
        claimName: eval-results
