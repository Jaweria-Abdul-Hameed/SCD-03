apiVersion: batch/v1
kind: Job
metadata:
  name: indexer-batch-b
  namespace: rahbar
  labels:
    app: indexer
    app.kubernetes.io/part-of: rahbar
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app: indexer
        app.kubernetes.io/part-of: rahbar
    spec:
      serviceAccountName: indexer-sa
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: indexer
          image: ghcr.io/rahbar/indexer:local
          imagePullPolicy: IfNotPresent
          args:
            - --corpus-dir
            - /corpus/batch_b
            - --data-root
            - /corpus
            - --additive
            - --report-out
            - /results/verification_batch_b.json
            - --print-summary
          envFrom:
            - configMapRef:
                name: rahbar-config
          volumeMounts:
            - name: corpus
              mountPath: /corpus
            - name: results
              mountPath: /results
            - name: tmp
              mountPath: /tmp
          # Sized from docs/evidence/ragops/f5_resource_measurements.txt: indexer-batch-b
          # finished in 7.1s (0 samples, <15s scrape window), so sized from the same image's
          # indexer-candidate profile (N=8: CPU p50=760.5m max=998m, Mem p50=176.5Mi max=198Mi;
          # limit ~ max*1.5 with OCR memory headroom).
          resources:
            requests:
              cpu: 750m
              memory: 192Mi
            limits:
              cpu: 1500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: corpus
          persistentVolumeClaim:
            claimName: corpus-data
        - name: results
          persistentVolumeClaim:
            claimName: eval-results
        - name: tmp
          emptyDir: {}
