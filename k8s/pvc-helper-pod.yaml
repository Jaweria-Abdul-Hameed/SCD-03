# Helper Pod for inspecting PVCs and copying corpus/traces/results via `kubectl cp` / `kubectl exec`.
apiVersion: v1
kind: Pod
metadata:
  name: pvc-helper
  namespace: rahbar
  labels:
    app: pvc-helper
    app.kubernetes.io/part-of: rahbar
spec:
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Always
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: pvc-helper
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
      volumeMounts:
        - name: corpus
          mountPath: /corpus
        - name: traces
          mountPath: /traces
        - name: results
          mountPath: /results
        - name: tmp
          mountPath: /tmp
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
  volumes:
    - name: corpus
      persistentVolumeClaim:
        claimName: corpus-data
    - name: traces
      persistentVolumeClaim:
        claimName: traces-data
    - name: results
      persistentVolumeClaim:
        claimName: eval-results
    - name: tmp
      emptyDir: {}
