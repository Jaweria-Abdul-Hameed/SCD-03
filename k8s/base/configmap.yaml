# RAHBAR shared configuration — single source of truth for the embedding pin
# and all tunable RAG parameters. The API and the indexer both read
# EMBED_MODEL from this ConfigMap (see assignment §3.2 / §4.4).
# temperature 0.0: facts and JSON belong at 0.0–0.3 (§3.4). Measured on the
# live stack (llama3.2:3b, EE PLO count question): at 0.2 three runs gave "11",
# "unspecified" and "7"; at 0.0 four runs gave an identical, correct "11".
# Temperature 0 does NOT fix hallucination (knowledge absent stays absent) —
# abstention and citation validation handle that.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
  namespace: rahbar
  labels:
    app.kubernetes.io/part-of: rahbar
data:
  EMBED_MODEL: "nomic-embed-text"
  EMBED_DIMENSION: "768"
  CHUNK_SIZE: "512"
  CHUNK_OVERLAP: "64"
  TOP_K: "5"
  # Floor 0.64 (cosine, nomic-embed-text WITH task prefixes): measured top-1 scores on the
  # live index were 0.52-0.62 for 4 clearly off-topic questions and >= 0.664 for all 13
  # answerable golden questions (docs/PIPELINE.md). The old 0.35 predates the prefixes
  # and rejected nothing. Topically adjacent absences (hostel 0.674, bus 0.652) pass
  # the floor and are left to the grounded-generation abstention.
  RELEVANCE_FLOOR: "0.64"
  # Cache threshold 0.96 = the lowest value with ZERO false hits on 7 near-miss question pairs
  # measured on the live stack (docs/adr/0002-semantic-cache-redis.md): 0.92 served the
  # "PLOs now" answer to "PLOs before 2024" (cosine 0.952).
  CACHE_THRESHOLD: "0.96"
  TEMPERATURE: "0.0"
  LLM_PROVIDER: "ollama-host"
  LLM_MODEL: "llama3.2:3b"
  OLLAMA_HOST: "host.minikube.internal:11434"
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "rahbar_corpus"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
