# RAHBAR API — read-only query path. NEVER indexes at startup (§4.2):
# indexing lives only in the indexer Job / reindex CronJob. This Deployment
# only reads Chroma + Redis and calls the LLM provider.
# Image placeholder: replaced by cd.yml with ${{ github.sha }} — never use a floating latest tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: rahbar
  labels:
    app: api
    app.kubernetes.io/part-of: rahbar
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/part-of: rahbar
    spec:
      serviceAccountName: api-sa
      automountServiceAccountToken: false
      # Service-link env vars (API_PORT=tcp://..., REDIS_PORT=..., CHROMA_PORT=...)
      # collide with app settings (pydantic int parse crash). Config comes from the ConfigMap.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/rahbar/api:SHA  # replaced by cd.yml with ${{ github.sha }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: rahbar-config
            - secretRef:
                name: rahbar-secret
                optional: true
          # Pinned directly in the Pod template so changes create a new ReplicaSet
          # revision and `kubectl rollout undo` restores the prior versions/prompt.
          env:
            - name: CHROMA_COLLECTION
              value: "rahbar_corpus"
            - name: COLLECTION_VERSION
              value: "v1"
            - name: EMBED_VERSION
              value: "nomic-embed-text:v1.5"
            - name: PROMPT_TEMPLATE
              value: "grounded_v1"
          volumeMounts:
            - name: traces
              mountPath: /traces
            - name: tmp
              mountPath: /tmp
          # Sized from docs/evidence/ragops/f5_resource_measurements.txt (api under eval load,
          # N=90: CPU p50=3.0m max=4m, Mem p50=78.0Mi max=79Mi). Memory request=80Mi (~p50),
          # limit=128Mi (>= 79*1.5=118.5Mi); CPU request=25m keeps HPA (70% target) at 12-16%
          # under steady load without false scale-out, and 100m limit avoids startup throttling.
          resources:
            requests:
              cpu: 25m
              memory: 80Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: traces
          persistentVolumeClaim:
            claimName: traces-data
        - name: tmp
          emptyDir: {}
