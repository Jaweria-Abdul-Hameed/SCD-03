# ClusterIP Services for the API and UI.
# All four RAHBAR Services are ClusterIP (never NodePort/LoadBalancer):
#   api    -> defined here
#   ui     -> defined here
#   chroma -> defined in chroma-statefulset.yaml (co-located so the
#             StatefulSet's serviceName binding is explicit in one file)
#   redis  -> defined in redis.yaml (co-located with its PVC)
# Keeping one Service object per name avoids duplicate definitions that
# would break `kustomize build`.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: rahbar
  labels:
    app: api
    app.kubernetes.io/part-of: rahbar
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: rahbar
  labels:
    app: ui
    app.kubernetes.io/part-of: rahbar
spec:
  type: ClusterIP
  selector:
    app: ui
  ports:
    - name: http
      port: 80
      targetPort: 8080
