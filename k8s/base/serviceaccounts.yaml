# One dedicated ServiceAccount per workload (§4.7).
# No workload calls the Kubernetes API server, so every pod sets
# automountServiceAccountToken: false — the accounts exist for identity
# and least-privilege separation, not for API access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-sa
  namespace: rahbar
  labels:
    app.kubernetes.io/part-of: rahbar
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: indexer-sa
  namespace: rahbar
  labels:
    app.kubernetes.io/part-of: rahbar
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chroma-sa
  namespace: rahbar
  labels:
    app.kubernetes.io/part-of: rahbar
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-sa
  namespace: rahbar
  labels:
    app.kubernetes.io/part-of: rahbar
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ui-sa
  namespace: rahbar
  labels:
    app.kubernetes.io/part-of: rahbar
