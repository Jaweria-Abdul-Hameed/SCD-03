# Part C3 / F3 Candidate Deployment + Service — isolated collection & config.
# Evaluated by pointing rahbar-gate-config EVAL_TARGET_API=http://api-candidate:8000
# before promoting to the live `api` Deployment (rollingUpdate maxUnavailable: 0).
apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-candidate-config
  namespace: rahbar
  labels:
    app: api-candidate
    app.kubernetes.io/part-of: rahbar
data:
  CHROMA_COLLECTION: "rahbar_corpus_candidate"
  COLLECTION_VERSION: "candidate-v2"
  PROMPT_TEMPLATE: "strict_concise_v2"
  TOP_K: "5"
  TRACE_FILE: "/traces/candidate_traces.jsonl"
---
apiVersion: v1
kind: Service
metadata:
  name: api-candidate
  namespace: rahbar
  labels:
    app: api-candidate
    app.kubernetes.io/part-of: rahbar
spec:
  type: ClusterIP
  selector:
    app: api-candidate
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-candidate
  namespace: rahbar
  labels:
    app: api-candidate
    app.kubernetes.io/part-of: rahbar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-candidate
  template:
    metadata:
      labels:
        app: api-candidate
        app.kubernetes.io/part-of: rahbar
    spec:
      serviceAccountName: api-sa
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/rahbar/api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: rahbar-config
            - configMapRef:
                name: rahbar-candidate-config
          volumeMounts:
            - name: traces
              mountPath: /traces
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: traces
          persistentVolumeClaim:
            claimName: traces-data
        - name: tmp
          emptyDir: {}
