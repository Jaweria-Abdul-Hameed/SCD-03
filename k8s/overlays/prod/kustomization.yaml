# Prod overlay — base manifests plus prod labels and explicit api replicas 3.
# Images are retagged by cd.yml with ${{ github.sha }} at deploy time;
# no floating latest tag is ever deployed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
resources:
  - ../../base
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        replicas: 3
    target:
      kind: Deployment
      name: api
labels:
  - pairs:
      env: prod
    includeSelectors: false
    includeTemplates: true
